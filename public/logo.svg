<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130" width="100%" height="100%">
  <defs>
    <!-- Outer Hexagon Gradient -->
    <linearGradient id="hexBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Hexagon Inner Background Gradient -->
    <radialGradient id="hexBgGrad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0c1930" />
      <stop offset="100%" stop-color="#050b16" />
    </radialGradient>

    <!-- Letter A Gradient -->
    <linearGradient id="letterAGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Orange Apex Node Gradient -->
    <radialGradient id="orangeOrbGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="30%" stop-color="#fb923c" />
      <stop offset="85%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </radialGradient>

    <!-- Neon Glow Filter for Letter A -->
    <filter id="neonAura" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Orange Halo Filter -->
    <filter id="orangeAura" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagon -->
  <polygon points="60,13 105,39 105,91 60,117 15,91 15,39"
           fill="url(#hexBgGrad)"
           stroke="url(#hexBorderGrad)"
           stroke-width="3"
           stroke-linejoin="round" />

  <!-- Inner 3D Cube Isometric Wireframe Lines -->
  <!-- Top Y-connection -->
  <line x1="60" y1="26" x2="32" y2="42" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.5" />
  <line x1="60" y1="26" x2="88" y2="42" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.5" />
  
  <!-- Outer Corners to Inner Nodes -->
  <line x1="15" y1="39" x2="32" y2="42" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.45" />
  <line x1="105" y1="39" x2="88" y2="42" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.45" />
  <line x1="15" y1="91" x2="32" y2="84" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.45" />
  <line x1="105" y1="91" x2="88" y2="84" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.45" />

  <!-- Vertical Cube Struts -->
  <line x1="32" y1="42" x2="32" y2="84" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.55" />
  <line x1="88" y1="42" x2="88" y2="84" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.55" />

  <!-- Bottom Isometric Base Lines -->
  <line x1="32" y1="84" x2="60" y2="100" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.5" />
  <line x1="88" y1="84" x2="60" y2="100" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.5" />
  <line x1="60" y1="100" x2="60" y2="117" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Cube Nodes (Cyan Vertices) -->
  <circle cx="32" cy="42" r="2.4" fill="#38bdf8" />
  <circle cx="88" cy="42" r="2.4" fill="#38bdf8" />
  <circle cx="32" cy="84" r="2.4" fill="#38bdf8" />
  <circle cx="88" cy="84" r="2.4" fill="#38bdf8" />

  <!-- Deep Blue Glow behind Letter A -->
  <path d="M 40,96 L 60,31 L 80,96 M 48,74 L 72,74"
        fill="none"
        stroke="#0284c7"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.45"
        filter="url(#neonAura)" />

  <!-- Mid Vibrant Cyan Glow -->
  <path d="M 40,96 L 60,31 L 80,96 M 48,74 L 72,74"
        fill="none"
        stroke="#38bdf8"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.75"
        filter="url(#neonAura)" />

  <!-- Foreground Crisp Letter A -->
  <path d="M 40,96 L 60,31 L 80,96 M 48,74 L 72,74"
        fill="none"
        stroke="url(#letterAGrad)"
        stroke-width="7.5"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Glowing Orange Apex Node -->
  <!-- Soft orange aura -->
  <circle cx="60" cy="30" r="10" fill="rgba(249, 115, 22, 0.45)" filter="url(#orangeAura)" />
  <!-- Crisp glowing orb -->
  <circle cx="60" cy="30" r="5.5" fill="url(#orangeOrbGrad)" stroke="#fed7aa" stroke-width="0.8" />
</svg>
